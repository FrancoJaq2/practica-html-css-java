<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <a href="index.html" class="boton-volver">Volver a Inicio</a>

    <h3>Formularios</h3>
    <p>Un formulario en HTML es la estructura principal que permite a los usuarios interactuar y enviar información a un servidor web.</p>

    <form>
        <input type="text" placeholder="Aquí tu usuario, no otra cosa">
        <input type="email" placeholder="Correo electrónico, usa @">
        <input type="password" placeholder="password, usa una difícil">
        <input type="date">
        <input type="file">
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
