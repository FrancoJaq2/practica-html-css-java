<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Visual</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <a href="index.html" class="boton-volver">Volver a Inicio</a>
    
    <h3>Galería Visual</h3>
    <p>Un espacio estructurado para exhibir ilustraciones, capturas y diseños.</p>

    <div class="galeria-grid">
        <div class="tarjeta-imagen">
            <img src="Imagenes/Jinx back shot.jpg" alt="Jinx back shot">
            <div class="overlay-texto">Captura - Jinx</div>
        </div>
        
        <div class="tarjeta-imagen">
            <img src="Imagenes/pierre_boceto.jpg" alt="Concept Art Pierre">
            <div class="overlay-texto">Concept Art: Pierre</div>
        </div>
        
        <div class="tarjeta-imagen">
            <img src="Imagenes/nish_referencia.jpg" alt="Concept Art Nish">
            <div class="overlay-texto">Concept Art: Nish</div>
        </div>

        <div class="tarjeta-imagen">
            <img src="Imagenes/dean_turnaround.jpg" alt="Concept Art Dean">
            <div class="overlay-texto">Concept Art: Dean</div>
        </div>
        
        <div class="tarjeta-imagen">
            <img src="Imagenes/setup_focusrite.jpg" alt="Setup">
            <div class="overlay-texto">Setup de Transmisión</div>
        </div>
    </div>
</body>
</html>
